# ─────────────────────────────────────────────────────────────
# HireSphere AI Backend - Application Properties
# ─────────────────────────────────────────────────────────────

# Server Port (Configurable via SERVER_PORT or .env)
server.port=${SERVER_PORT:8085}

# Application Name
spring.application.name=${APP_NAME:hiresphere-backend}

# ─────────────────────────────────────────────────────────────
# Persistent Real-Time Database Configuration (100% Free & Embedded)
# ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hiresphere_realtime_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (Available at http://localhost:8085/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}
spring.h2.console.settings.web-allow-others=true

# Logging Configuration
logging.level.com.hiresphere=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ─────────────────────────────────────────────────────────────
# Autonomous Agentic AI Configuration (Gemini API / Free Tier)
# ─────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
