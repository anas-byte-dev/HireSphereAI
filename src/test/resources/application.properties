# Test Application Properties
server.port=8085
spring.application.name=hiresphere-backend-test

# In-memory H2 database for test isolation
spring.datasource.url=jdbc:h2:mem:hiresphere_test_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable disk persistence during tests to isolate test cases
hiresphere.storage.persist-to-disk=false
